name: Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache/binary
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-cache/downloads
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache/binary,readwrite;nugettimeout,300;nuget,https://nuget.pkg.github.com/Bobini1/index.json,readwrite'
  VCPKG_USE_NUGET_CACHE: 'true'
  VCPKG_MAX_CONCURRENCY: '2'
  ANDROID_HOME: ''
  ANDROID_NDK_HOME: ''
  ANDROID_NDK_LATEST_HOME: ''
  ANDROID_NDK_ROOT: ''
  ANDROID_SDK_ROOT: ''

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare vcpkg cache folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            "${{ github.workspace }}/.vcpkg-cache/binary", `
            "${{ github.workspace }}/.vcpkg-cache/downloads", `
            "${{ github.workspace }}/.vcpkg-buildtrees", `
            "${{ github.workspace }}/.vcpkg-packages" | Out-Null

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'vcpkgTriplets/**', 'vcpkgOverlayPorts*/**') }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'vcpkgTriplets/**', 'vcpkgOverlayPorts*/**') }}-
            vcpkg-${{ runner.os }}-

      - name: Install WMF
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Install-WindowsFeature Server-Media-Foundation

      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install libtbb-dev libgl-dev libegl1-mesa-dev libdrm-dev libgles2-mesa-dev libudev-dev nasm autoconf automake autoconf-archive gperf pkg-config python3-jinja2 '^libxcb.*-dev' libx11-xcb-dev libglu1-mesa-dev libxrender-dev libxi-dev libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libltdl-dev libxrandr-dev mono-complete -y

      - name: Set up Python for vcpkg
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python virtualenv for vcpkg
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check virtualenv
          $python = python -c "import sys; print(sys.executable)"
          Set-Content -Path .vcpkg-ci-python3 -Value $python -NoNewline
          Add-Content "$env:GITHUB_ENV" "VCPKG_PYTHON3=$python"

      - name: Export environment variables for vcpkg binary caching
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('VCPKG_ROOT', process.env.VCPKG_INSTALLATION_ROOT || '');
            core.exportVariable('VCPKG_EXE', process.env.VCPKG_INSTALLATION_ROOT + '/vcpkg' || '');
            core.exportVariable('NUGET_FEED_URL', 'https://nuget.pkg.github.com/Bobini1/index.json' || '');

      - name: Add NuGet sources
        shell: bash
        if: matrix.os == 'ubuntu-latest'
        run: |
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            sources add \
            -Source "${{ env.NUGET_FEED_URL }}" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "Bobini1" \
            -Password "${{ secrets.GITHUB_TOKEN }}"
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "${{ env.NUGET_FEED_URL }}"

      - name: Add NuGet sources
        shell: pwsh
        if: matrix.os == 'windows-latest'
        run: |
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
          sources add `
          -Source "${{ env.NUGET_FEED_URL }}" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "Bobini1" `
          -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
          setapikey "${{ secrets.GITHUB_TOKEN }}" `
          -Source "${{ env.NUGET_FEED_URL }}"

      - name: Configure
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          cmake --preset=ci-ubuntu 2>&1 | tee configure.log

      - name: Configure
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake --preset=ci-windows 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Report configure failure
        if: failure()
        shell: pwsh
        run: .github/scripts/report-configure-failure.ps1

      - name: Upload configure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-logs-${{ github.job }}-${{ runner.os }}
          path: |
            configure.log
            build/**/CMakeFiles/CMakeConfigureLog.yaml
            build/**/CMakeFiles/CMakeError.log
            build/**/CMakeFiles/CMakeOutput.log
            build/**/vcpkg-manifest-install.log
          if-no-files-found: ignore

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build --config Debug --target RhythmGame_exe -j 2

      - name: Install
        shell: bash
        run: cmake --install build --config Debug --prefix $PWD/prefix

      - name: Upload Debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.os }}
          path: ${{ github.workspace }}/prefix/
          if-no-files-found: error
